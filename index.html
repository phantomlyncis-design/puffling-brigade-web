<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puffling Brigade</title>
<style>html,body{margin:0;height:100%;background:#fff}</style>
<script>
  // อย่าลบ: คนที่กลับจากล็อกอิน Google มาตกหน้านี้ ส่งต่อเข้าเกมพร้อมโทเคน
  (function () {
    var h = location.hash || '', q = location.search || '';
    if (/access_token=|error=|error_description=/.test(h) || /[?&](code|error)=/.test(q))
      location.replace('/game/' + q + h);
  })();
</script>
</head>
<body></body>
</html>
