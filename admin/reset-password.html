<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ตั้งรหัสผ่านใหม่ · PUFFLING BRIGADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login">
  <h1>ตั้งรหัสผ่านใหม่</h1>
  <p class="sub">PUFFLING BRIGADE</p>

  <div id="formArea" hidden>
    <label for="pw1">รหัสผ่านใหม่</label>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัว มีตัวเลขด้วย">

    <label for="pw2">พิมพ์รหัสผ่านใหม่อีกครั้ง</label>
    <input id="pw2" type="password" autocomplete="new-password">

    <button id="saveBtn" class="btn">บันทึกรหัสผ่านใหม่</button>
  </div>

  <div id="msg" class="msg wait">กำลังตรวจลิงก์…</div>

  <p class="note" style="margin-top:20px">
    ตั้งรหัสใหม่เสร็จแล้ว กลับไปเข้าสู่ระบบในเกมได้เลย
  </p>
</div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";

  var CFG = window.PUFFLING_CONFIG || { url: "", anonKey: "" };
  var token = null;

  function $(id) { return document.getElementById(id); }
  function say(text, kind) {
    var el = $("msg");
    el.textContent = text;
    el.className = "msg " + (kind || "");
  }

  // Supabase ส่งโทเคนมาใน fragment ของ URL (หลัง #) ไม่ใช่ query string
  // ทำแบบนี้เพราะ fragment ไม่ถูกส่งไปที่เซิร์ฟเวอร์ โทเคนจึงไม่ไปโผล่ใน log ของเว็บเซิร์ฟเวอร์
  function readToken() {
    var hash = window.location.hash || "";
    if (hash.charAt(0) === "#") hash = hash.substring(1);
    var parts = hash.split("&");
    var out = {};
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (kv.length === 2) out[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
    }
    return out;
  }

  function validate(pw) {
    if (!pw || pw.length < 8) return "รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร";
    var hasLetter = /[A-Za-zก-๙]/.test(pw);
    var hasDigit = /[0-9]/.test(pw);
    if (!hasLetter || !hasDigit) return "รหัสผ่านต้องมีทั้งตัวอักษรและตัวเลข";
    return null;
  }

  async function save() {
    var pw1 = $("pw1").value;
    var pw2 = $("pw2").value;

    var err = validate(pw1);
    if (err) { say(err, "err"); return; }
    if (pw1 !== pw2) { say("รหัสผ่านสองช่องไม่ตรงกัน", "err"); return; }

    $("saveBtn").disabled = true;
    say("กำลังบันทึก…", "wait");

    try {
      var res = await fetch(CFG.url.replace(/\/+$/, "") + "/auth/v1/user", {
        method: "PUT",
        headers: {
          "apikey": CFG.anonKey,
          "Authorization": "Bearer " + token,   // โทเคนจากลิงก์ในอีเมล
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password: pw1 })
      });

      var text = await res.text();
      if (!res.ok) {
        var data = null;
        try { data = JSON.parse(text); } catch (e) {}
        var m = (data && (data.message || data.msg || data.error_description)) || text;
        if (/expired|invalid/i.test(m)) {
          throw new Error("ลิงก์หมดอายุหรือถูกใช้ไปแล้ว — กลับไปกดลืมรหัสผ่านในเกมใหม่อีกครั้ง");
        }
        throw new Error(m);
      }

      $("formArea").hidden = true;
      say("ตั้งรหัสผ่านใหม่เรียบร้อย กลับไปเข้าสู่ระบบในเกมได้เลย", "ok");
      // ลบโทเคนออกจากแถบที่อยู่ กันคนเห็นตอนแชร์หน้าจอ
      history.replaceState(null, "", window.location.pathname);
    } catch (e) {
      say(e.message, "err");
      $("saveBtn").disabled = false;
    }
  }

  function boot() {
    if (!CFG.url || !CFG.anonKey) {
      say("ยังไม่ได้ตั้งค่า — เปิดไฟล์ config.js แล้วใส่ URL กับ publishable key", "err");
      return;
    }

    var params = readToken();

    if (params.error_description) {
      say(decodeURIComponent(params.error_description.replace(/\+/g, " ")), "err");
      return;
    }
    if (params.type && params.type !== "recovery") {
      say("ลิงก์นี้ไม่ใช่ลิงก์ตั้งรหัสผ่านใหม่", "err");
      return;
    }
    if (!params.access_token) {
      say("ไม่พบโทเคนในลิงก์ — ต้องเปิดหน้านี้จากลิงก์ในอีเมลเท่านั้น", "err");
      return;
    }

    token = params.access_token;
    $("formArea").hidden = false;
    say("ลิงก์ถูกต้อง ตั้งรหัสผ่านใหม่ได้เลย", "wait");

    $("saveBtn").addEventListener("click", save);
    $("pw2").addEventListener("keydown", function (e) { if (e.key === "Enter") save(); });
  }

  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
