<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <meta name="theme-color" content="#2e2740">
    <title>เล่น Puffling Brigade — กองทัพปุยนุ่น</title>
    <meta name="description" content="เล่น Puffling Brigade กองทัพปุยนุ่น ฟรีผ่านเว็บ เกมจัดทีมต่อสู้แบบเรียลไทม์ สะสมตัวละคร คริสตัลได้จากการเล่นเท่านั้น">
    <link rel="canonical" href="https://puffling-brigade.com/game/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="th_TH">
    <meta property="og:site_name" content="Puffling Brigade">
    <meta property="og:title" content="เล่น Puffling Brigade — กองทัพปุยนุ่น">
    <meta property="og:description" content="เกมจัดทีมต่อสู้แบบเรียลไทม์ เล่นฟรีผ่านเว็บ">
    <meta property="og:url" content="https://puffling-brigade.com/game/">
    <meta property="og:image" content="https://puffling-brigade.com/assets/social-cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="preload" href="TemplateData/bg.webp" as="image">
    <link rel="preload" href="TemplateData/logo.webp" as="image">
    <!--
      หน้าโหลดเกมของ Puffling Brigade (เจ้าของ 13 ต.ค.: "ไม่ต้องการให้แสดง unity เลย")
      หน้าตาเดียวกับหน้าโหลดในเกม (BootView): ฉาก login_loading · โลโก้ · หลอดมีราชันวิ่ง · เคล็ดลับ
      เกมเต็มหน้าต่างเสมอ (ทั้งคอมและมือถือ) · ภาพสร้างจาก tools/spritepack/prep_web_loader.py
    -->
    <style>
      @font-face { font-family: "PBSarabun"; src: url("TemplateData/sarabun-bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2e2740; }
      body { position: fixed; inset: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #2e2740; outline: none; }

      /* ---------- หน้าโหลด ---------- */
      #pb-loader { position: absolute; inset: 0; overflow: hidden; z-index: 10;
                   background: #f3b77a url("TemplateData/bg.webp") center / cover no-repeat;
                   transition: opacity .45s ease; }
      #pb-loader.done { opacity: 0; pointer-events: none; }
      /* เวที 1920x1080 ย่อ/ขยายตามจอแบบเดียวกับในเกม (กลางจอเสมอ) */
      #pb-stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
                  transform-origin: 0 0; font-family: "PBSarabun", "Sarabun", "Leelawadee UI", "Tahoma", sans-serif; font-weight: 700; }
      #pb-logo { position: absolute; left: 50%; top: 60px; width: 540px; margin-left: -270px;
                 filter: drop-shadow(0 8px 14px rgba(53, 48, 74, .35)); animation: pb-pop .6s cubic-bezier(.2, 1.5, .4, 1) both; }
      @keyframes pb-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      .pb-text { color: #FFF6E4;
                 text-shadow: -2px -2px 0 #35304A, 2px -2px 0 #35304A, -2px 2px 0 #35304A, 2px 2px 0 #35304A,
                              0 -2px 0 #35304A, 0 2px 0 #35304A, -2px 0 0 #35304A, 2px 0 0 #35304A, 0 3px 6px rgba(0,0,0,.35); }
      /* แถบเข้มใต้ข้อความสถานะ (ฉากหลังสว่าง ตัวหนังสือเปล่า ๆ อ่านยาก) — อยู่เหนือหัวราชันที่วิ่งบนหลอด ไม่ทับกัน */
      #pb-band { position: absolute; left: 420px; width: 1080px; bottom: 318px; height: 50px; box-sizing: border-box;
                 border-style: solid; border-width: 25px 35px; border-image: url("TemplateData/tip.png") 44 46 fill / 25px 35px / 0 stretch; opacity: .8; }
      #pb-status { position: absolute; left: 454px; bottom: 321px; width: 840px; height: 44px; line-height: 44px; font-size: 27px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #pb-percent { position: absolute; right: 454px; bottom: 321px; width: 160px; height: 44px; line-height: 44px; font-size: 27px; text-align: right; }

      /* หลอด (กรอบ 9 ช่องจากภาพในเกม) */
      #pb-track { position: absolute; left: 420px; bottom: 150px; width: 1080px; height: 72px; }
      #pb-trackbg { position: absolute; inset: 0; box-sizing: border-box;
                    border-style: solid; border-width: 36px 37px; border-image: url("TemplateData/bar_track.png") 46 48 fill / 36px 37px / 0 stretch; }
      #pb-fill { position: absolute; left: 13px; top: 13px; height: 46px; width: 46px; box-sizing: border-box; display: none;
                 border-style: solid; border-width: 23px 24px; border-image: url("TemplateData/bar_fill.png") 36 38 fill / 23px 24px / 0 stretch; }
      #pb-spark { position: absolute; top: 0; width: 64px; height: 72px; margin-left: -32px; display: none;
                  animation: pb-twinkle 1.1s ease-in-out infinite; }
      @keyframes pb-twinkle { 0%, 100% { transform: scale(.85) rotate(0deg); opacity: .85; } 50% { transform: scale(1.1) rotate(12deg); opacity: 1; } }
      #pb-runner { position: absolute; bottom: 66px; height: 96px; transform-origin: 62% 100%;
                   animation: pb-hop .36s ease-in-out infinite alternate; }
      @keyframes pb-hop { from { transform: translateX(-62%) translateY(0) rotate(-4deg) scaleY(.97); }
                          to   { transform: translateX(-62%) translateY(-10px) rotate(-1deg) scaleY(1.02); } }

      /* เคล็ดลับใต้หลอด / ข้อผิดพลาด */
      #pb-tip { position: absolute; left: 510px; width: 900px; bottom: 59px; height: 58px; }
      #pb-tipbg { position: absolute; inset: 0; box-sizing: border-box;
                  border-style: solid; border-width: 29px 35px; border-image: url("TemplateData/tip.png") 44 46 fill / 29px 35px / 0 stretch; opacity: .9; }
      #pb-tip span { position: absolute; left: 34px; right: 34px; top: 0; height: 58px; line-height: 58px; font-size: 23px; text-align: center;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .35s ease; }
      #pb-retry { position: absolute; left: 50%; bottom: 40px; width: 360px; height: 84px; margin-left: -180px; display: none;
                  border: 4px solid #1F6B4E; border-radius: 42px; background: linear-gradient(#7fe0b6, #34b884); cursor: pointer;
                  font: 700 32px "PBSarabun", "Sarabun", sans-serif; color: #fff; text-shadow: 0 2px 0 #1F6B4E; box-shadow: 0 6px 0 rgba(31,107,78,.45); }
      #pb-retry:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(31,107,78,.45); }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="pb-loader">
      <div id="pb-stage">
        <img id="pb-logo" src="TemplateData/logo.webp" alt="Puffling Brigade">
        <div id="pb-band"></div>
        <div id="pb-status" class="pb-text">กำลังโหลดเกม…</div>
        <div id="pb-percent" class="pb-text">0%</div>
        <div id="pb-track">
          <div id="pb-trackbg"></div>
          <div id="pb-fill"></div>
          <img id="pb-spark" src="TemplateData/spark.webp" alt="">
          <img id="pb-runner" src="TemplateData/runner.webp" alt="">
        </div>
        <div id="pb-tip"><div id="pb-tipbg"></div><span class="pb-text"></span></div>
        <button id="pb-retry" type="button">ลองใหม่</button>
      </div>
    </div>
    <script>
      (function () {
        var canvas = document.querySelector("#unity-canvas");
        var loader = document.querySelector("#pb-loader");
        var stage = document.querySelector("#pb-stage");
        var statusEl = document.querySelector("#pb-status");
        var percentEl = document.querySelector("#pb-percent");
        var fill = document.querySelector("#pb-fill");
        var spark = document.querySelector("#pb-spark");
        var runner = document.querySelector("#pb-runner");
        var tipBox = document.querySelector("#pb-tip");
        var tipEl = document.querySelector("#pb-tip span");
        var retry = document.querySelector("#pb-retry");

        // ---------- เวที 1920x1080 ย่อพอดีจอ อยู่กลางเสมอ ----------
        function fit() {
          // เนื้อหาจริงกว้าง ~1160 (หลอด 1080) — ย่อตามนั้น มือถือแนวตั้งจะได้ไม่เล็กจิ๋ว
          var k = Math.min(window.innerWidth / 1160, window.innerHeight / 1080);
          stage.style.transform = "scale(" + k + ") translate(-50%, -50%)";
        }
        fit();
        window.addEventListener("resize", fit);

        // ---------- เคล็ดลับ (ชุดเดียวกับในเกม) ----------
        var tips = [
          "เคล็ดลับ: วางตัวอึด ๆ ไว้แถวหน้า คอยกันศัตรูให้พลธนูข้างหลัง",
          "เคล็ดลับ: ความคืบหน้าบันทึกขึ้นคลาวด์ให้อัตโนมัติ เล่นต่อเครื่องไหนก็ได้",
          "เคล็ดลับ: เล่นได้ทีละเครื่อง — เข้าจากเครื่องใหม่ เครื่องเก่าจะออกให้เอง",
          "เคล็ดลับ: คริสตัลหาได้จากการเล่นเท่านั้น ไม่มีการเติมเงิน",
          "เคล็ดลับ: ดูอัตราการออกของทุกระดับความหายากได้ก่อนกดสุ่มกาชาเสมอ",
          "เคล็ดลับ: ได้ตัวซ้ำจากกาชา จะได้เศษไว้เลื่อนดาวตัวนั้น"
        ];
        var tipIndex = Math.floor(Math.random() * tips.length);
        tipEl.textContent = tips[tipIndex];
        var tipTimer = setInterval(function () {
          tipEl.style.opacity = 0;
          setTimeout(function () { tipIndex = (tipIndex + 1) % tips.length; tipEl.textContent = tips[tipIndex]; tipEl.style.opacity = 1; }, 350);
        }, 5500);

        // ---------- หลอด: ค่อย ๆ ไล่ตามค่าจริง (ไม่กระตุก) ----------
        var BAR_W = 1080, PAD = 13, FH = 46;
        var target = 0, shown = 0;
        function draw(p) {
          var inner = BAR_W - PAD * 2;
          var w = Math.max(FH, inner * p);
          fill.style.display = p > 0.001 ? "block" : "none";
          fill.style.width = w + "px";
          var x = PAD + (p > 0.001 ? w : 0);
          spark.style.display = p > 0.001 ? "block" : "none";
          spark.style.left = (x - 6) + "px";
          runner.style.left = Math.max(PAD + 40, x) + "px";
          percentEl.textContent = Math.floor(p * 100) + "%";
        }
        function tick() {
          shown += (target - shown) * 0.12;
          if (target - shown < 0.002) shown = target;
          draw(shown);
          if (!finished) requestAnimationFrame(tick);
        }
        var finished = false;
        draw(0);
        requestAnimationFrame(tick);

        function showError(msg) {
          clearInterval(tipTimer);
          statusEl.textContent = "โหลดเกมไม่สำเร็จ";
          statusEl.style.color = "#FFD2CC";
          tipEl.textContent = msg;
          tipEl.style.opacity = 1;
          tipBox.style.bottom = "140px";
          retry.style.display = "block";
        }
        retry.onclick = function () { location.reload(); };

        // ---------- ตั้งค่าเกม ----------
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/WebGL.data.unityweb",
          frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
          codeUrl: buildUrl + "/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Cats SSR",
          productVersion: "1.0",
          // ข้อความเตือนของเอนจิน (ไม่โชว์แถบเหลือง/แดงของ Unity) — ข้อผิดพลาดร้ายแรงจะไปที่ catch ด้านล่าง
          showBanner: function (msg, type) { if (window.console) console.warn("[เกม] " + msg); }
        };

        // เครื่องที่อ่านรูปแบบ ASTC ได้ (iPad/iPhone/Android ส่วนใหญ่) ใช้ไฟล์ข้อมูลชุด ASTC (BuildTools.cs บิลด์ให้)
        // ชุดปกติเป็น DXT ซึ่ง Safari อ่านไม่ได้ เกมต้องแตกรูปเป็น RGBA ใหญ่ 4 เท่า → iPad แรมเต็ม ค้าง/เด้งออก
        // (WEBGL_compressed_texture_astc — deploy_web.py เห็นคำนี้แล้วจะไม่ใส่ซ้ำ)
        try {
          var astcProbe = document.createElement("canvas");
          var astcGl = astcProbe.getContext("webgl2") || astcProbe.getContext("webgl");
          if (astcGl && astcGl.getExtension("WEBGL_compressed_texture_astc")) {
            config.dataUrl = buildUrl + "/WebGL.astc.data.unityweb";
          }
          var astcLose = astcGl && astcGl.getExtension("WEBGL_lose_context");
          if (astcLose) astcLose.loseContext();
        } catch (e) {}

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onerror = function () { showError("ต่ออินเทอร์เน็ตไม่ได้ ตรวจการเชื่อมต่อแล้วกดลองใหม่"); };
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            // ช่วงดาวน์โหลด = 0–95% · ที่เหลือคือเกมกำลังเตรียมตัว
            target = Math.min(0.95, progress * 0.95);
            if (progress >= 1) statusEl.textContent = "กำลังเตรียมเกม…";
          }).then(function () {
            target = 1;
            statusEl.textContent = "พร้อมแล้ว!";
            setTimeout(function () {
              finished = true;
              clearInterval(tipTimer);
              loader.classList.add("done");
              setTimeout(function () { loader.remove(); }, 600);
              canvas.focus();
            }, 350);
          }).catch(function (message) {
            if (window.console) console.error(message);
            showError("เบราว์เซอร์นี้เปิดเกมไม่ได้ ลองใช้ Chrome, Edge หรือ Safari รุ่นล่าสุด");
          });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
